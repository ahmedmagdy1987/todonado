# MOVED — this file is no longer the source of truth.
#
# The database job now lives in the real workflow, at:
#
#     .github/workflows/ci.yml   ->  job `database`
#         name: database (postgres 17, disposable)
#
# and the PostgREST permission smoke lives beside it as:
#
#     .github/workflows/ci.yml   ->  job `supabase`
#         name: supabase postgrest permissions (local stack)
#
# It was here for one iteration only, because the Personal Access Token in use
# lacked the `workflow` scope and GitHub refuses a push that edits
# .github/workflows without it. Keeping a second copy would have meant two
# independently maintained definitions of the same job, which is how they drift.
#
# Run the same checks locally:
#
#     npm install --no-save embedded-postgres   # real PG binaries, ~100 MB
#     npm run db:start
#     DATABASE_URL=postgres://postgres@localhost:55432/postgres npm run db:apply
#     DATABASE_URL=postgres://postgres@localhost:55432/postgres npm run test:db
#
#     supabase start && npm run test:postgrest   # needs Docker
