<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      THE DEFAULTS, AND THEY ARE ONLY EVER DEFAULTS.

      scripts/prerender.mjs uses this file as its template and REPLACES the
      title, description, canonical, og: and twitter: values per route from
      src/prerender/routes.ts. What is written here therefore survives in
      exactly two places: `vite dev`, and `app.html` - the noindex SPA shell
      that answers /today, /focus and every typo. That shell is what a
      signed-in user's browser tab reads, which is why these are kept current
      rather than left at whatever the homepage said two releases ago.

      `src/prerender/routes.test.ts` fails if they drift from the root route.
    -->
    <title>Todonado: plan the day you actually have, then work it</title>
    <meta
      name="description"
      content="Todonado is a day planner built around the time you really have. It covers work, health, family, errands and money, and runs the plan in a focus timer so you can see where the time went."
    />
    <link rel="canonical" href="https://www.todonado.com/welcome" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Todonado" />
    <meta property="og:title" content="Todonado: plan the day you actually have, then work it" />
    <meta
      property="og:description"
      content="Todonado is a day planner built around the time you really have. It covers work, health, family, errands and money, and runs the plan in a focus timer so you can see where the time went."
    />
    <meta property="og:url" content="https://www.todonado.com/welcome" />
    <meta property="og:image" content="https://www.todonado.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Todonado: plan the day you actually have, then work it" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Todonado: plan the day you actually have, then work it" />
    <meta
      name="twitter:description"
      content="Todonado is a day planner built around the time you really have. It covers work, health, family, errands and money, and runs the plan in a focus timer so you can see where the time went."
    />
    <meta name="twitter:image" content="https://www.todonado.com/og-image.png" />
    <meta name="twitter:image:alt" content="Todonado: plan the day you actually have, then work it" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#0A0D16" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Warm up the API origin so the first Supabase call (auth/session) is faster -->
    <link rel="preconnect" href="https://lplsbfduankkpglyusjp.supabase.co" crossorigin />

    <!-- Fonts: Inter (UI), Poppins (display), IBM Plex Mono (metrics). display=swap
         (in the CSS URL) renders text immediately with a fallback, no blocking. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
