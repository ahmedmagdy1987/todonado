<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Todonado — Plan a realistic day, not a wish-list</title>
    <meta
      name="description"
      content="Todonado is a daily command center for effort-aware planning. Tag each task with the time it takes and a live capacity meter shows what actually fits — so you commit to a day you can finish, and recover gracefully when plans slip."
    />
    <link rel="canonical" href="https://www.todonado.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Todonado" />
    <meta property="og:title" content="Todonado — Plan a realistic day, not a wish-list" />
    <meta
      property="og:description"
      content="Effort-aware planning for a day you can actually finish. Tag each task with the time it takes; a live capacity meter shows what fits."
    />
    <meta property="og:url" content="https://www.todonado.com/" />
    <meta property="og:image" content="https://www.todonado.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Todonado — Plan a realistic day, not a wish-list" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Todonado — Plan a realistic day, not a wish-list" />
    <meta
      name="twitter:description"
      content="Effort-aware planning for a day you can actually finish. Tag each task with the time it takes; a live capacity meter shows what fits."
    />
    <meta name="twitter:image" content="https://www.todonado.com/og-image.png" />
    <meta name="twitter:image:alt" content="Todonado — Plan a realistic day, not a wish-list" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#0A0D16" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Fonts: Inter (UI), Poppins (display), IBM Plex Mono (metrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
