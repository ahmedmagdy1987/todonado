name: CI

# Cloud-verify every push/PR to main so a change is validated even when the
# local gates are skipped (this project's dev machine gets wiped often).
#
# NO JOB HERE CONTACTS THE PRODUCTION SUPABASE PROJECT, and that is enforced
# rather than intended: the two database jobs refuse a `supabase.co` host
# outright, the e2e and csp jobs null-route the production hostname in
# /etc/hosts before they start, and scripts/assert-local-supabase.mjs fails the
# job before any socket opens. No secrets are required by any of it.
on:
  push:
    # `ci-probe/**` exists so a NEGATIVE CONTROL can be run.
    #
    # Every gate in this file is a claim that something would fail if the code
    # were wrong, and the only honest way to support that claim is to break the
    # code on purpose and watch the job go red. The database and Supabase jobs
    # cannot run on a developer machine without Docker, so "on purpose" has to
    # mean a real run here. A throwaway `ci-probe/...` branch carries the
    # deliberate mutation, the run is recorded, and the branch is deleted. None
    # of it is ever merged, and nothing outside this prefix is affected.
    #
    # TWO PREFIXES, because the jobs a probe needs differ. `ci-probe/**` skips
    # `verify`, `e2e` and `csp` (see the note on `verify`) since a database gate
    # is the target and the browser suites are expensive. `ci-probe-full/**`
    # runs everything, for the controls whose target IS the e2e guard or the
    # enforcing CSP.
    branches: [main, 'ci-probe/**', 'ci-probe-full/**']
  pull_request:
    branches: [main]
  # Manual re-runs, once this file is on the default branch.
  workflow_dispatch:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    # A ci-probe branch exists to watch ONE database gate go red. Neither this
    # job nor the browser smoke is ever the target, and the smoke signs a real
    # account up on the live Supabase project — running it ten times to observe
    # an unrelated failure would be waste with a side effect.
    if: ${{ !startsWith(github.ref_name, 'ci-probe/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # THE PLATFORM'S OWN COMPILATION CONTEXT.
      #
      # `npm run typecheck` builds api/ under tsconfig.api.json (lib ES2023, no
      # DOM). Vercel compiles the same files against the ROOT tsconfig.json,
      # which has no compilerOptions, so the DOM lib is included. Two different
      # lib sets over one set of files, and CI only ever checked one of them —
      # which is how commit 1304b36's TS2322 (Buffer -> BodyInit) passed every
      # gate here and failed the production build. See tsconfig.api.vercel.json.
      - run: npm run typecheck:vercel
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e smoke (chromium, local supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # See the note on `verify`: probe branches skip this deliberately.
    if: ${{ !startsWith(github.ref_name, 'ci-probe/') }}
    # THIS JOB NO LONGER TOUCHES THE PRODUCTION PROJECT.
    #
    # It used to sign a throwaway account up on the live Supabase auth server,
    # write rows into live tables and delete itself afterwards, on every push.
    # No secret was involved — the anon key is public and committed — but it was
    # an automated job mutating a customer database, one failed cleanup away
    # from leaving a real user behind. It now starts its own stack, and the
    # production hostname is null-routed below so it CANNOT reach the real one
    # even if something tried.
    env:
      # Same rule as the database and PostgREST gates: a journey that skipped is
      # a journey nobody ran, and Playwright exits 0 for a skip.
      # 82 -> 87: e2e/landing.spec.ts gained five browser-level checks for the
      # hero vortex (decorative, orbiting + parking, reduced motion, the
      # staggered entrance always resolving visible, and both CTA destinations).
      #
      # 87 -> 91: e2e/marketing.spec.ts gained four price-consistency checks.
      # The public page quoted $6/mo while Stripe charged $5/mo and $48/yr, and
      # nothing compared a RENDERED price with anything.
      #
      # 91 -> 92: and one more for the intro COPY, which said prices were "an
      # early hypothesis" and "nothing is charged yet" directly above them.
      # 92 -> 93: e2e/landing.spec.ts gained a check that completing a hero task
      # never changes a row height or the hero's height, which is the failure the
      # new completion animation could introduce and a screenshot would not catch.
      EXPECTED_E2E_TESTS: '93'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1.4.0
        with:
          version: 2.111.0

      - name: Free any stale Supabase ports
        run: |
          supabase stop --no-backup || true
          for p in 54320 54321 54322 54323 54324 54327 54329; do
            sudo fuser -k -n tcp "$p" 2>/dev/null || true
          done

      # storage and realtime ARE included here (unlike the permissions job):
      # journal-audio.spec.ts uploads and signs objects, and useRealtimeSync
      # opens a websocket the moment the app shell mounts.
      - name: Start the local Supabase stack
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pooler,mailpit
          supabase status

      # PROOF, NOT A PROMISE. The default project host from src/lib/env.ts is
      # null-routed for the rest of the job, so if any code path still reached
      # for production it fails to connect instead of quietly succeeding. The
      # host is read out of the source rather than typed here, so it cannot go
      # stale and this file does not become the last place production is
      # hardcoded.
      - name: Make the production Supabase project UNREACHABLE
        run: |
          HOST=$(node -e "
            const s = require('fs').readFileSync('src/lib/env.ts','utf8');
            const m = s.match(/https:\/\/([a-z0-9-]+\.supabase\.co)/);
            if (!m) { console.error('no default Supabase host found in src/lib/env.ts'); process.exit(1) }
            console.log(m[1])")
          echo "null-routing $HOST for this job"
          echo "127.0.0.1 $HOST" | sudo tee -a /etc/hosts
          getent hosts "$HOST"

      - name: Export the LOCAL stack, and refuse anything hosted
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
          echo "local API: $API_URL"

      # A named, visible refusal rather than a stack trace inside a runner.
      - name: Guard — no test path may reach a hosted Supabase project
        run: node scripts/assert-local-supabase.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/e2e-results.json
        run: npm run e2e -- --reporter=list,json

      # Several specs gate themselves on `tableExists`, which was the right call
      # while migrations were pending against a shared cloud project. Against a
      # stack built from the whole chain nothing may skip — a skipped journey is
      # a journey nobody ran, and it exits 0.
      - name: Confirm every E2E test actually executed
        run: |
          node -e "
          const r = require('/tmp/e2e-results.json');
          let passed = 0, failed = 0, skipped = 0;
          const walk = (suite) => {
            for (const spec of suite.specs ?? []) {
              for (const t of spec.tests ?? []) {
                const s = t.status ?? t.results?.[0]?.status;
                if (s === 'skipped') skipped++;
                else if (spec.ok) passed++;
                else failed++;
              }
            }
            for (const child of suite.suites ?? []) walk(child);
          };
          for (const s of r.suites ?? []) walk(s);
          const expected = Number(process.env.EXPECTED_E2E_TESTS);
          console.log({ passed, failed, skipped, expected });
          if (failed > 0) { console.error('::error::' + failed + ' E2E tests failed'); process.exit(1) }
          if (skipped > 0) { console.error('::error::' + skipped + ' E2E tests were SKIPPED'); process.exit(1) }
          if (passed !== expected) {
            console.error('::error::expected ' + expected + ' executed E2E tests, got ' + passed +
              '. If this is an intentional change, update EXPECTED_E2E_TESTS.');
            process.exit(1)
          }
          console.log('all ' + passed + ' E2E tests executed and passed');
          "

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
  database:
    name: database (postgres 17, disposable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A REAL PostgreSQL. The clause-pinning suites in api/ read the migration
    # TEXT; only this job proves the SQL parses, installs, locks, and enforces
    # privileges. It uses no secrets and never touches the production project.
    #
    # Pinned to 17 because supabase/config.toml declares major_version = 17.
    # That is the repo's own declaration of the production major, not a reading
    # of the live instance, which this job is forbidden to contact.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Every executed database test must run. A suite that errors in a hook
      # reports "N passed | M skipped" and exits 0, which already hid a real
      # failure once.
      #
      # 69 -> 128. The billing privilege matrix is now stated in full (4 roles x
      # 7 privileges, plus the installed ACL read back from the catalog), RLS is
      # asserted separately from the table grant because confusing the two is
      # what produced the 42501, and db-tests/billingGrant.db.test.ts adds the
      # staged proof that 20260801160000 is what grants the SELECT.
      #
      # 131 -> 142. db-tests/issue8Cleanup.db.test.ts EXECUTES the issue #8
      # cleanup script (docs/, deliberately not named here — see below) against
      # a scratch database seeded with the exact production inventory. PL/pgSQL
      # fails at run time, not at parse time, so a guard that never fires until
      # production has drifted is precisely the code that has to be run before
      # it is trusted: each one is shown to ABORT with nothing deleted.
      #
      # THE FILENAME IS ABSENT ON PURPOSE. src/test/issue8CleanupSafety.test.ts
      # asserts that no workflow names that script, because a name in CI is one
      # edit away from a step that runs it against something real. The rule is
      # absolute rather than "unless it is only a comment", since a scanner
      # cannot tell the two apart and neither can a hurried reviewer.
      #
      # 142 -> 167. db-tests/calendarSourcesGuard.db.test.ts covers the FLAG-5
      # write guard, and two of its cases are the whole reason that guard is a
      # trigger rather than a count: with the advisory lock removed, two
      # concurrent transactions BOTH take the last slot and twenty concurrent
      # inserts from empty ALL land. Verified by running exactly that negative
      # control before committing.
      #
      # 167 -> 172. The hostile migration review added the boundary cases the
      # first pass had not probed: an UNCOMMITTED delete must not free a slot,
      # one transaction inserting past the cap, the lock released on ROLLBACK,
      # the pre-existing url length cap, and the timing-dependent case where a
      # slot frees mid-statement — that last one asserts the INVARIANT rather
      # than the outcome, because asserting the outcome was genuinely flaky.
      EXPECTED_DB_TESTS: '172'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Print the PostgreSQL version actually used
        run: |
          node -e "const pg=require('pg');const c=new pg.Client(process.env.DATABASE_URL);
          c.connect().then(()=>c.query('show server_version')).then(r=>{console.log('PostgreSQL',r.rows[0].server_version);return c.end()})"

      # From EMPTY, chronological, every migration — not only the pending two.
      # A migration that works only when its predecessors were applied by hand
      # is not a migration that works.
      - name: Apply the full migration chain
        run: node supabase/test/apply.mjs --reset

      - name: Reset and apply the whole chain a second time
        run: node supabase/test/apply.mjs --reset

      # IT MUST REFUSE, NOT MERELY FAIL.
      #
      # This step used to check the exit code alone, and that is not the same
      # question: `db.abcdefgh.supabase.co` does not resolve, so apply.mjs exits
      # non-zero whether the guard fired or it simply could not connect. Deleting
      # the guard outright left this step GREEN — found by running exactly that
      # mutation as a negative control. The refusal message is now required, so
      # the check fails when the guard is gone.
      - name: A production-looking host must be refused, for the right reason
        run: |
          set +e
          out=$(DATABASE_URL='postgres://u:p@db.abcdefgh.supabase.co:5432/postgres' \
                node supabase/test/apply.mjs --reset 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "::error::apply.mjs ACCEPTED a supabase.co host"; exit 1
          fi
          if ! echo "$out" | grep -q 'REFUSING to run against a supabase.co host'; then
            echo "::error::apply.mjs exited $code but never refused the host. Failing to \
          connect is not the same as declining to try, and only the guard stops a real \
          project being migrated by accident."
            exit 1
          fi
          echo "refused a supabase.co host, and said so"

      # BOTH reporters. With `--reporter=json` alone a failure prints NOTHING to
      # the log — the JSON goes to a file and the run says only "exit code 1",
      # which is a database failure you cannot diagnose without re-running.
      - name: Privilege and concurrency tests (real connections)
        run: |
          npm run test:db -- --reporter=default --reporter=json \
            --outputFile.json=/tmp/db-results.json

      # "passed with skipped tests" is not a database proof.
      - name: Confirm every expected database test actually executed
        run: |
          node -e "
          const r = require('/tmp/db-results.json');
          const expected = Number(process.env.EXPECTED_DB_TESTS);
          const { numTotalTests: total, numPassedTests: passed,
                  numFailedTests: failed, numPendingTests: skipped } = r;
          console.log({ total, passed, failed, skipped, expected });
          if (failed > 0) { console.error('::error::' + failed + ' database tests failed'); process.exit(1) }
          if (skipped > 0) { console.error('::error::' + skipped + ' database tests were SKIPPED'); process.exit(1) }
          if (passed !== expected) {
            console.error('::error::expected ' + expected + ' executed database tests, got ' + passed +
              '. If this is an intentional change, update EXPECTED_DB_TESTS.');
            process.exit(1)
          }
          console.log('all ' + passed + ' database tests executed and passed');
          "

  supabase:
    name: supabase postgrest permissions (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Raw PostgreSQL proves locks, constraints and catalog privileges. It does
    # NOT prove the path the application actually uses: PostgREST, with the
    # anon / authenticated / service_role keys. This job runs a FULLY LOCAL
    # Supabase stack and exercises exactly those interfaces.
    #
    # No production URL, key, user or datum is used anywhere in it.
    env:
      # Same reasoning as EXPECTED_DB_TESTS in the job above: this suite exists
      # to prove permissions, and a permission test that did not run has proved
      # nothing. Until now it had no gate at all, so a throwing `beforeAll`
      # would have reported "0 passed" and exited 0 — the exact failure mode the
      # database job already learned about the hard way.
      EXPECTED_POSTGREST_TESTS: '43'
      # Same rule for the fresh-project suite. It is the one that answers "is
      # this a working application", so a silently skipped test here is a
      # migration chain nobody has actually run an app against.
      EXPECTED_SMOKE_TESTS: '56'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1.4.0
        with:
          # Pinned, but it must be NEWER than the CLI that wrote
          # supabase/config.toml. 2.22.6 was tried and rejected the file
          # outright: "'auth' has invalid keys: oauth_server, web3",
          # "'db' has invalid keys: health_timeout, network_restrictions".
          # Pinning below the config's own vocabulary is not caution, it is a
          # guaranteed failure.
          version: 2.111.0

      # First run failed here with
      #   "failed to bind host port for 0.0.0.0:54322: address already in use"
      # before Supabase had started anything, so something on the runner holds
      # the port. Show what, rather than guessing.
      - name: Show what holds the Supabase ports
        run: |
          sudo ss -ltnp | grep -E ':5432[0-9]' || echo "nothing listening on 5432x"
          docker ps -a --format '{{.Names}} {{.Ports}}' || true

      - name: Free any stale Supabase ports
        run: |
          supabase stop --no-backup || true
          for p in 54320 54321 54322 54323 54324 54327 54329; do
            sudo fuser -k -n tcp "$p" 2>/dev/null || true
          done
          sudo ss -ltnp | grep -E ':5432[0-9]' || echo "ports clear"

      # Postgres, GoTrue, PostgREST — and STORAGE, which joined the list when the
      # fresh-project suite started proving that journal recordings really are
      # private to their owner (the bucket policies key on the first path
      # segment, and only a real storage service exercises that). Studio,
      # realtime, imgproxy, edge-runtime, analytics and the pooler are not
      # exercised here, and each is another image to pull and another port to
      # collide on.
      - name: Start the local Supabase stack
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pooler,mailpit,realtime
          supabase status

      - name: Show what it applied
        run: supabase migration list --local

      # IS IT A WORKING APPLICATION, not merely a database that applied?
      #
      # This is the suite the previous iteration could not have written: it
      # signs real users up through GoTrue and drives the real flows through
      # PostgREST on a stack built from nothing but the migrations. Before
      # 20260801170000 a fresh project answered 42501 to every read, and every
      # existing suite stayed green because none of them ever tried.
      - name: Fresh-project functional smoke (real users, real flows)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test:smoke -- --reporter=default --reporter=json \
            --outputFile.json=/tmp/smoke-results.json

      - name: Confirm every expected fresh-project test actually executed
        run: |
          node -e "
          const r = require('/tmp/smoke-results.json');
          const expected = Number(process.env.EXPECTED_SMOKE_TESTS);
          const { numTotalTests: total, numPassedTests: passed,
                  numFailedTests: failed, numPendingTests: skipped } = r;
          console.log({ total, passed, failed, skipped, expected });
          if (failed > 0) { console.error('::error::' + failed + ' fresh-project tests failed'); process.exit(1) }
          if (skipped > 0) { console.error('::error::' + skipped + ' fresh-project tests were SKIPPED'); process.exit(1) }
          if (passed !== expected) {
            console.error('::error::expected ' + expected + ' executed fresh-project tests, got ' + passed +
              '. If this is an intentional change, update EXPECTED_SMOKE_TESTS.');
            process.exit(1)
          }
          console.log('all ' + passed + ' fresh-project tests executed and passed');
          "

      # EVIDENCE, NOT ASSUMPTION.
      #
      # The 42501 on public.billing was diagnosed as "service_role never had a
      # GRANT; the platform stopped handing them out" — supabase/config.toml
      # says `auto_expose_new_tables` implicitly flipped to false on 2026-05-30.
      # That is a claim about someone else's product, so the stack is asked
      # directly and the answer is printed into the run. It is also how the next
      # session finds out if the platform changes again.
      - name: What the local stack ACTUALLY granted
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          DATABASE_URL="$DB_URL" node -e "
          const pg = require('pg');
          const c = new pg.Client(process.env.DATABASE_URL);
          const show = async (label, sql) => {
            const r = await c.query(sql);
            console.log('== ' + label);
            console.table(r.rows);
          };
          c.connect()
            .then(() => show('default privileges on this stack (pg_default_acl)',
              \"select defaclrole::regrole::text as for_role, defaclnamespace::regnamespace::text as in_schema, defaclobjtype as obj, defaclacl::text as acl from pg_default_acl\"))
            .then(() => show('grants on the tables this suite reasons about',
              \"select c.relname, coalesce(nullif(a.grantee::regrole::text,'-'),'PUBLIC') as grantee, a.privilege_type from pg_class c join pg_namespace n on n.oid=c.relnamespace left join lateral aclexplode(c.relacl) a on true where n.nspname='public' and c.relkind='r' and c.relname in ('billing','checkout_attempts','tasks','projects','profiles') order by 1,2,3\"))
            .then(() => c.end())
            .catch((e) => { console.error('diagnostic failed:', e.message); return c.end().then(() => process.exit(1)) });
          "

      - name: PostgREST permission smoke
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          echo "local API: $SUPABASE_URL"
          # Both reporters, for the reason given on the database job's test step.
          npm run test:postgrest -- --reporter=default --reporter=json \
            --outputFile.json=/tmp/postgrest-results.json

      - name: Confirm every expected PostgREST test actually executed
        run: |
          node -e "
          const r = require('/tmp/postgrest-results.json');
          const expected = Number(process.env.EXPECTED_POSTGREST_TESTS);
          const { numTotalTests: total, numPassedTests: passed,
                  numFailedTests: failed, numPendingTests: skipped } = r;
          console.log({ total, passed, failed, skipped, expected });
          if (failed > 0) { console.error('::error::' + failed + ' PostgREST tests failed'); process.exit(1) }
          if (skipped > 0) { console.error('::error::' + skipped + ' PostgREST tests were SKIPPED'); process.exit(1) }
          if (passed !== expected) {
            console.error('::error::expected ' + expected + ' executed PostgREST tests, got ' + passed +
              '. If this is an intentional change, update EXPECTED_POSTGREST_TESTS.');
            process.exit(1)
          }
          console.log('all ' + passed + ' PostgREST tests executed and passed');
          "

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  csp:
    name: enforcing CSP (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.ref_name, 'ci-probe/') }}
    # THE POLICY THAT SHIPS, ENFORCING, AGAINST THE BUILT APP.
    #
    # Every other CSP check in this repo asserts the policy's TEXT. None has run
    # the app under it: the E2E suite drives the Vite dev server, which serves
    # the same policy Report-Only on purpose (Vite needs an inline HMR preamble
    # and a ws://localhost connection that production forbids), so a directive
    # that broke the product would surface as a console warning nobody fails on.
    #
    # A Vercel Preview would be better still and is NOT usable: the project has
    # Deployment Protection on, so a preview answers 302 to vercel.com/sso-api
    # for anything without a Vercel session, and both ways to change that are
    # changes to the Vercel project this iteration may not make. See
    # scripts/serve-production-like.mjs for what this proves instead.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1.4.0
        with:
          version: 2.111.0

      - name: Free any stale Supabase ports
        run: |
          supabase stop --no-backup || true
          for p in 54320 54321 54322 54323 54324 54327 54329; do
            sudo fuser -k -n tcp "$p" 2>/dev/null || true
          done

      - name: Start the local Supabase stack
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pooler,mailpit,realtime,storage
          supabase status

      - name: Make the production Supabase project UNREACHABLE
        run: |
          HOST=$(node -e "
            const s = require('fs').readFileSync('src/lib/env.ts','utf8');
            const m = s.match(/https:\/\/([a-z0-9-]+\.supabase\.co)/);
            if (!m) { console.error('no default Supabase host found in src/lib/env.ts'); process.exit(1) }
            console.log(m[1])")
          echo "127.0.0.1 $HOST" | sudo tee -a /etc/hosts

      - name: Export the LOCAL stack, and refuse anything hosted
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Guard — no test path may reach a hosted Supabase project
        run: node scripts/assert-local-supabase.mjs

      # Built with the LOCAL stack baked in: the bundle inlines the VITE_ vars
      # at build time, and the enforcing connect-src must name the origin the
      # bundle actually calls.
      - name: Build the production bundle
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Enforcing-CSP smoke
        run: npm run test:csp

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
